<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workouts</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f3a34">
<style>
:root{--bg:#f3f1ec;--ink:#1d2421;--card:#fff;--line:#d4d0c6;--acc:#1f3a34;--hi:#c8e65a;--mut:#6b726e}
@media(prefers-color-scheme:dark){:root{--bg:#141a18;--ink:#eceae3;--card:#1f2724;--line:#36403c;--acc:#c8e65a;--hi:#c8e65a;--mut:#97a09b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,"Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px}
h1{font-size:20px;margin:0;font-weight:700}
.nav button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;margin-left:6px}
.bar{display:grid;grid-template-columns:1fr .7fr 1.3fr;gap:8px;padding:6px 12px 10px}
.bar label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
select,input{width:100%;font-size:16px;padding:7px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:0}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
table{border-collapse:separate;border-spacing:0;min-width:520px;width:100%}
th{font-size:13px;text-align:left;padding:6px;background:var(--acc);color:var(--bg);position:sticky;top:0;white-space:nowrap}
@media(prefers-color-scheme:dark){th{color:#141a18}}
td{padding:3px;border-bottom:1px solid var(--line)}
td input{border-color:transparent;background:transparent;padding:8px 4px}
td input:focus{border-color:var(--acc);background:var(--bg)}
.s{position:sticky;left:0;background:var(--card);z-index:1;border-right:1px solid var(--line)}
th.s{background:var(--acc);z-index:2}
.cE{width:128px}.cW{width:95px}.cR{width:72px}.cM{width:150px}.cC{width:190px}.cX{width:44px}.cD{width:132px}.cY{width:54px}
.x{background:none;border:0;color:var(--mut);font-size:20px;width:36px}
.row2{display:flex;gap:8px;padding:10px 12px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--acc);background:none;color:var(--ink);font-size:16px}
.save{background:var(--acc);color:var(--bg);font-weight:700;font-size:18px}
@media(prefers-color-scheme:dark){.save{color:#141a18}}
#st{padding:0 12px 14px;font-size:13px;color:var(--mut);min-height:20px}
.pg{display:none}.pg.on{display:block}
.set{padding:12px}.set label{display:block;margin:10px 0 3px;font-size:14px}.set p{font-size:13px;color:var(--mut)}
</style></head><body>

<section id="cur" class="pg on">
 <header><h1>Workouts</h1><span class="nav"><button id="bh">History</button><button id="bs">⚙</button></span></header>
 <div class="bar">
  <div><label>User</label><select id="u"><option>Paul</option><option>Corrina</option></select></div>
  <div><label>Day</label><select id="d"><option>1</option><option>2</option></select></div>
  <div><label>Current date</label><input id="dt" type="date"></div>
 </div>
 <div class="sc"><table><thead><tr>
  <th class="s cE">Exercise</th><th class="cW">Weight</th><th class="cR">Reps</th><th class="cC">Comments</th><th class="cX"></th>
 </tr></thead><tbody id="cb"></tbody></table></div>
 <div class="row2"><button class="btn" id="add">+ Add exercise</button></div>
 <div class="row2"><button class="btn save" id="save">SAVE</button></div>
 <div id="st"></div>
</section>

<section id="his" class="pg">
 <header><h1>History</h1><span class="nav"><button id="hb">Back</button></span></header>
 <div class="bar" style="grid-template-columns:1fr 1fr"><div><label>User</label><select id="hu"><option>All</option><option>Paul</option><option>Corrina</option></select></div></div>
 <div class="sc"><table style="min-width:700px"><thead><tr>
  <th class="cD">Date</th><th class="cY">Day</th><th class="s cE" style="left:auto;position:static">Exercise</th><th class="cW">Weight</th><th class="cR">Reps</th><th class="cC">Comments</th><th class="cX"></th>
 </tr></thead><tbody id="hbod"></tbody></table></div>
 <div class="row2"><button class="btn save" id="hs">Save changes</button><button class="btn" id="ex">Export CSV</button></div>
 <div id="st2" style="padding:0 12px 14px;font-size:13px;color:var(--mut)"></div>
</section>

<section id="set" class="pg set">
 <header style="padding:0"><h1>GitHub setup</h1><span class="nav"><button id="sb">Back</button></span></header>
 <p>Use a private repo for data. Token: fine-grained, this repo only, Contents read/write. It stays on this phone only.</p>
 <label>Repo (owner/name)</label><input id="gr" placeholder="yourname/workout-data" autocapitalize="none" autocorrect="off">
 <label>Branch</label><input id="gb" placeholder="main" autocapitalize="none">
 <label>File path</label><input id="gp" placeholder="workouts.json" autocapitalize="none">
 <label>Token</label><input id="gt" type="password" autocapitalize="none" autocomplete="off">
 <div class="row2" style="padding:14px 0"><button class="btn save" id="gs">Save settings</button></div>
</section>

<script>
const $=s=>document.querySelector(s),LS='wk_';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const J=(k,def)=>{try{return JSON.parse(localStorage.getItem(LS+k))??def}catch{return def}};
let cfg=J('cfg',{}),db=J('db',{entries:[]}),S={user:localStorage.getItem(LS+'user')||'Paul',date:todayStr(),day:1},rows=[],edits={},dels=new Set();
const persist=()=>localStorage.setItem(LS+'db',JSON.stringify(db));
const status=t=>{$('#st').textContent=t;$('#st2').textContent=t};
const enc=s=>{let b='';new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const parse=s=>{const t=dec(s||'').trim();const o=t?JSON.parse(t):{};if(!Array.isArray(o.entries))o.entries=[];return o};

/* ---------- GitHub sync ---------- */
const gh=(m,body)=>{const br=cfg.branch||'main',p=cfg.path||'workouts.json';
 return fetch(`https://api.github.com/repos/${cfg.repo}/contents/${p}`+(m==='GET'?`?ref=${br}&t=${Date.now()}`:''),
 {method:m,cache:'no-store',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)})};
async function pull(){
 if(!cfg.token||!cfg.repo)return;
 try{const r=await gh('GET');if(r.status===200){const j=await r.json();db=parse(j.content);persist()}
  else if(r.status!==404)throw new Error('GitHub '+r.status)}catch(e){status('Load failed ('+e.message+'). Showing phone copy.')}
}
async function push(fn){
 if(!cfg.token||!cfg.repo){status('Saved on phone only. Add GitHub in ⚙.');return}
 status('Saving to GitHub…');
 try{for(let i=0;i<3;i++){
  const r=await gh('GET');let remote={entries:[]},sha;
  if(r.status===200){const j=await r.json();sha=j.sha;remote=parse(j.content)}else if(r.status!==404)throw new Error('GitHub '+r.status);
  fn(remote);
  const p=await gh('PUT',{message:'Update workouts',content:enc(JSON.stringify(remote,null,1)),branch:cfg.branch||'main',sha});
  if(p.ok){db=remote;persist();status('Saved to GitHub ✓');return}
  if(p.status!==409&&p.status!==422)throw new Error('GitHub '+p.status)}
  throw new Error('conflict')}
 catch(e){status(e.name==='TypeError'?'Saved on phone. Cannot reach api.github.com: check signal, content blocker/shields, or VPN. ('+e.message+')':'Saved on phone, GitHub failed: '+e.message)}
}
const mutate=fn=>{fn(db);persist();return push(fn)};

/* ---------- current screen ---------- */
function autoDay(){
 const es=db.entries.filter(e=>e.user===S.user&&e.date<=S.date).sort((a,b)=>a.date<b.date?-1:1);
 if(!es.length)return 1;const l=es[es.length-1];
 return l.date===S.date?+l.day:(+l.day===1?2:1);
}
function loadRows(){
 const mine=db.entries.filter(e=>e.user===S.user&&+e.day===+S.day);
 let src=mine.filter(e=>e.date===S.date);
 if(!src.length){const pd=mine.filter(e=>e.date<S.date).map(e=>e.date).sort().pop();src=pd?mine.filter(e=>e.date===pd):[]}
 rows=src.map(e=>({id:uid(),exercise:e.exercise,weight:e.weight,reps:e.reps,comments:e.comments}));
 if(!rows.length)rows=[blank()];
 renderCur();
}
const blank=()=>({id:uid(),exercise:'',weight:'',reps:'',comments:''});
function syncBar(){$('#u').value=S.user;$('#d').value=S.day;$('#dt').value=S.date}
function renderCur(){
 $('#cb').innerHTML=rows.map((r,i)=>`<tr>
 <td class="s cE"><input data-i="${i}" data-f="exercise" value="${esc(r.exercise)}" autocapitalize="words"></td>
 <td class="cW"><input data-i="${i}" data-f="weight" value="${esc(r.weight)}"></td>
 <td class="cR"><input data-i="${i}" data-f="reps" value="${esc(r.reps)}"></td>
 <td class="cC"><input data-i="${i}" data-f="comments" value="${esc(r.comments)}"></td>
 <td class="cX"><button class="x" data-del="${i}">×</button></td></tr>`).join('');
}
$('#cb').addEventListener('input',e=>{const t=e.target;if(t.dataset.f)rows[t.dataset.i][t.dataset.f]=t.value});
$('#cb').addEventListener('click',e=>{const i=e.target.dataset.del;if(i!==undefined){rows.splice(i,1);if(!rows.length)rows=[blank()];renderCur()}});
$('#add').onclick=()=>{rows.push(blank());renderCur();$('#cb').lastElementChild.querySelector('input').focus()};
$('#u').onchange=e=>{S.user=e.target.value;localStorage.setItem(LS+'user',S.user);S.day=autoDay();syncBar();loadRows()};
$('#d').onchange=e=>{S.day=+e.target.value;loadRows()};
$('#dt').onchange=e=>{if(!e.target.value)return;S.date=e.target.value;S.day=autoDay();syncBar();loadRows()};
$('#save').onclick=()=>{
 const {user,date,day}=S;
 const list=rows.filter(r=>r.exercise.trim()||r.weight.trim()||r.reps.trim()).map(r=>({id:r.id,date,user,day,exercise:r.exercise.trim(),weight:r.weight.trim(),reps:r.reps.trim(),comments:r.comments.trim()}));
 mutate(d=>{d.entries=d.entries.filter(e=>!(e.user===user&&e.date===date)).concat(list)});
};

/* ---------- history ---------- */
function renderHis(){
 const u=$('#hu').value;
 const es=db.entries.filter(e=>u==='All'||e.user===u).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
 $('#hbod').innerHTML=es.length?es.map(e=>`<tr>
 <td class="cD"><input type="date" data-id="${e.id}" data-f="date" value="${esc(e.date)}"></td>
 <td class="cY"><select data-id="${e.id}" data-f="day"><option${+e.day===1?' selected':''}>1</option><option${+e.day===2?' selected':''}>2</option></select></td>
 <td class="cE"><input data-id="${e.id}" data-f="exercise" value="${esc(e.exercise)}"></td>
 <td class="cW"><input data-id="${e.id}" data-f="weight" value="${esc(e.weight)}"></td>
 <td class="cR"><input data-id="${e.id}" data-f="reps" value="${esc(e.reps)}"></td>
 <td class="cC"><input data-id="${e.id}" data-f="comments" value="${esc(e.comments)}"></td>
 <td class="cX"><button class="x" data-xid="${e.id}">×</button></td></tr>`).join(''):'<tr><td colspan="7" style="padding:16px">No workouts saved yet. Save one on the main screen.</td></tr>';
}
$('#hbod').addEventListener('change',e=>{const t=e.target,id=t.dataset.id;if(!id)return;
 const ent=edits[id]||{...db.entries.find(x=>x.id===id)};ent[t.dataset.f]=t.dataset.f==='day'?+t.value:t.value;edits[id]=ent});
$('#hbod').addEventListener('click',e=>{const id=e.target.dataset.xid;if(!id)return;
 if(confirm('Delete this row?')){dels.add(id);delete edits[id];e.target.closest('tr').remove()}});
$('#hu').onchange=renderHis;
$('#hs').onclick=async()=>{const E={...edits},D=new Set(dels);edits={};dels.clear();
 await mutate(d=>{d.entries=d.entries.filter(x=>!D.has(x.id)).map(x=>E[x.id]||x)});loadRows();renderHis()};
$('#ex').onclick=async()=>{
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const es=[...db.entries].sort((a,b)=>a.date<b.date?-1:1);
 const csv=['User,Date,Day,Exercise,Weight,Reps,Comments'].concat(es.map(e=>[e.user,e.date,e.day,e.exercise,e.weight,e.reps,e.comments].map(q).join(','))).join('\r\n');
 const f=new File([csv],'workouts-'+todayStr()+'.csv',{type:'text/csv'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Workout data'});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();
};

/* ---------- navigation + settings ---------- */
const show=id=>{document.querySelectorAll('.pg').forEach(p=>p.classList.toggle('on',p.id===id));scrollTo(0,0)};
$('#bh').onclick=()=>{renderHis();show('his')};$('#hb').onclick=()=>show('cur');
$('#bs').onclick=()=>{$('#gr').value=cfg.repo||'';$('#gb').value=cfg.branch||'';$('#gp').value=cfg.path||'';$('#gt').value=cfg.token||'';show('set')};
$('#sb').onclick=()=>show('cur');
$('#gs').onclick=async()=>{cfg={repo:$('#gr').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,''),branch:$('#gb').value.trim()||'main',path:$('#gp').value.trim()||'workouts.json',token:$('#gt').value.trim()};
 localStorage.setItem(LS+'cfg',JSON.stringify(cfg));show('cur');await pull();S.day=autoDay();syncBar();loadRows();status('GitHub settings saved')};

/* ---------- start ---------- */
(async()=>{S.day=autoDay();syncBar();loadRows();await pull();S.day=autoDay();syncBar();loadRows()})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
